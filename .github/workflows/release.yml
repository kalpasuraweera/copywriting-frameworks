name: Release

# Push a version tag (e.g. `git tag v1.0.0 && git push origin v1.0.0`) to build
# copywriting-frameworks.skill and publish it as a GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .skill archive
        run: |
          cd skills
          zip -r -X ../copywriting-frameworks.skill copywriting-frameworks
          cd ..
          unzip -l copywriting-frameworks.skill

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" copywriting-frameworks.skill \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
